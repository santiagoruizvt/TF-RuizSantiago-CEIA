# Entrenamiento de PhysNet (decisión 10.4). Valores iniciales razonables; la
# búsqueda de hiperparámetros es la tarea 3.4. Cualquier valor se puede pisar
# desde la línea de comandos: --set train.epochs=5 data.input_size=36
run_name: physnet_v1
seed: 2026

data:
  raw_root: data/raw                       # ground_truth.txt de cada sujeto
  processed_root: data/processed/ubfc_rppg  # crops.npz de scripts/extract_traces.py
  splits: configs/splits.yaml
  input_size: 72        # lado de los recortes que ve la red (los guardados son de 128).
                        # 72 en vez de 128 reduce ~3x el costo por paso (R2).
  chunk_length: 128     # frames por tramo (~4,3 s a 30 fps); múltiplo de 4
  train_stride: 64      # paso entre tramos de entrenamiento (solapamiento del 50 %)

augment:                # solo en entrenamiento (R1); ver rppg.dl.dataset.Augmenter
  flip_p: 0.5
  gain_drift: 0.1       # ganancia de iluminación que varía hasta ±10 % a lo largo del tramo
  noise_std: 0.01       # ruido gaussiano, en fracción del rango [0, 255]

train:
  epochs: 30
  batch_size: 4
  lr: 1.0e-3
  weight_decay: 1.0e-5
  num_workers: 0        # 0 en Windows; en Colab se puede subir a 2
  amp: true             # precisión mixta (solo si hay GPU)
  device: auto          # auto | cpu | cuda

# Selección del checkpoint: el de menor MAE de HR en validación, medido con el
# protocolo común (configs/eval.yaml).
eval_config: configs/eval.yaml

output_dir: checkpoints  # se crea <output_dir>/<run_name>/
