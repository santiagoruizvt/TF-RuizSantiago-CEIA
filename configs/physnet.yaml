# Entrenamiento de PhysNet (decisión 10.4). La búsqueda de hiperparámetros es
# la tarea 3.4. Cualquier valor se puede pisar desde la línea de comandos:
#   --set train.epochs=5 data.input_size=36
run_name: physnet_v4     # v4: configuración final de la tarea 3.4 (v0.1.9)
seed: 2026               # la configuración final se entrena con 2026, 2027 y 2028

data:
  raw_root: data/raw                       # ground_truth.txt de cada sujeto
  processed_root: data/processed/ubfc_rppg  # crops.npz de scripts/extract_traces.py
  splits: configs/splits.yaml
  input_size: 72        # lado de los recortes que ve la red (los guardados son de 128).
                        # 72 en vez de 128 reduce ~3x el costo por paso (R2).
  chunk_length: 128     # frames por tramo (~4,3 s a 30 fps); múltiplo de 4
  train_stride: 64      # paso entre tramos de entrenamiento (solapamiento del 50 %)

augment:                # solo en entrenamiento (R1, R4); ver rppg.dl.dataset.Augmenter
  flip_p: 0.5
  gain_drift: 0.1       # ganancia de iluminación que varía hasta ±10 % a lo largo del tramo
  noise_std: 0.01       # ruido gaussiano, en fracción del rango [0, 255]
  # Velocidad temporal: reproduce el tramo más rápido o más lento (video y PPG
  # juntos), con probabilidad speed_p. speed_p: 0 lo desactiva (ablación).
  speed_p: 0.8
  # Cómo se elige la velocidad:
  # - uniform: uniforme en speed_range. Con 0,6 a 1,4, los tramos de train
  #   (HR de 53 a 135 bpm, solo 55 de 829 por debajo de 80) también cubren
  #   ~40 a ~190 bpm, pero siguen concentrados entre 80 y 120. Fue la
  #   configuración hasta physnet_v3 (speed_p 0.5).
  # - hr_balanced (sobremuestreo por HR, sugerencia del director): HR objetivo
  #   uniforme en target_hr_range y velocidad = objetivo / HR del tramo,
  #   recortada a speed_range. Para 45 a 150 bpm hacen falta de 0,33 a 2,81.
  #   Elegido en la v0.1.9: con la validación reproducida a 0,7x y 1,4x,
  #   physnet_v3_hrbal dio MAE 0,70 y 0,83 bpm contra 6,26 y 3,76 de physnet_v3,
  #   sin empeorar a 1,0x (0,60 vs. 0,53).
  speed_mode: hr_balanced
  speed_range: [0.4, 2.0]
  target_hr_range: [45, 150]   # solo con hr_balanced
  # Recorte temporal aleatorio: el inicio de cada tramo se desplaza al azar
  # dentro de train_stride. Descartado en la v0.1.9: physnet_v3_jitter no
  # mejoró a 1,0x (0,48 vs. 0,53) y empeoró a 0,7x (11,51 vs. 6,26).
  temporal_jitter: false

train:
  epochs: 30
  batch_size: 4
  lr: 1.0e-4            # con 1e-3 (physnet_v1) sobreajustaba desde la época 2
  weight_decay: 1.0e-5
  num_workers: 0        # 0 en Windows; en Colab se puede subir a 2
  amp: true             # precisión mixta (solo si hay GPU)
  device: auto          # auto | cpu | cuda
  # Criterio para elegir best.pt:
  # - val_loss: 1 - Pearson de la señal sobre todos los tramos de validación;
  # - val_mae: MAE de HR de los sujetos de validación. Es más ruidoso: en
  #   physnet_v1 eligió un pico aislado (época 13).
  select_by: val_loss
  early_stopping_patience: 5   # épocas sin mejora antes de cortar; null lo desactiva

infer:                  # cómo se arma la señal de un video completo (validación y evaluación)
  # Tramos solapados al 50 %, combinados con pesos de Hann que bajan el peso de
  # los bordes, donde la red tiene menos contexto. En physnet_v2 (val) bajó el
  # MAE de 5,34 a 0,49 bpm: corrige el armónico en subject37 (v0.1.7).
  # null o igual a chunk_length: tramos sin solapamiento (modo anterior).
  stride: 64
  # Promediar con el video espejado: en physnet_v2 cambió el MAE en 0,01 bpm
  # con el doble de costo, así que queda apagado.
  flip_average: false

eval_config: configs/eval.yaml   # protocolo común (R5)

output_dir: checkpoints  # se crea <output_dir>/<run_name>/
