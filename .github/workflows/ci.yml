# Lint y tests en cada Pull Request y en cada push a main.
# El dataset real no está en CI: los tests de integración usan el dataset
# sintético de tests/conftest.py y los que requieren UBFC-rPPG real se saltean.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # opencv-contrib-python (no headless, lo trae mediapipe) necesita libGL.
      - name: Install system libraries for OpenCV
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # --locked falla si uv.lock no coincide con pyproject.toml. Sin el extra
      # `dl`: torch no hace falta para los tests actuales y tarda en instalarse.
      - name: Install dependencies
        run: uv sync --locked

      # Modelo de MediaPipe para los tests del detector. Si no está en cache,
      # los tests lo descargan y verifican su hash (configs/face.yaml).
      - name: Cache MediaPipe model
        uses: actions/cache@v4
        with:
          path: models
          key: mediapipe-${{ hashFiles('configs/face.yaml') }}

      - name: Ruff lint
        run: uv run ruff check src tests

      - name: Ruff format
        run: uv run ruff format --check src tests

      - name: Tests
        run: uv run pytest -q -rs
