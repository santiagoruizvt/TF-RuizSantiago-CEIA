[project]
name = "rppg"
version = "0.1.0"
description = "Vital signs (HR, RR) estimation from facial video via remote photoplethysmography: classical and deep learning pipelines."
readme = "README.md"
authors = [{ name = "Santiago Ruiz" }]
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "matplotlib>=3.8",
    # mediapipe instala opencv-contrib-python; declarar también opencv-python
    # instalaría dos copias del módulo cv2 en conflicto.
    "opencv-contrib-python>=4.8",
    "mediapipe>=0.10.14",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# Etapa 2 (PhysNet). Wheels de CPU en local; Colab ya trae torch con CUDA.
dl = [
    "torch>=2.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "ipywidgets>=8.1",
    "scikit-image>=0.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rppg"]

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]
